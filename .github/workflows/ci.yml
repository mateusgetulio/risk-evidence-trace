name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rte
          POSTGRES_PASSWORD: rte
          POSTGRES_DB: rte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rte -d rte"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PYTHONPATH: packages/decision/src:services/api
      TEST_DATABASE_URL: postgresql+psycopg://rte:rte@localhost:5432/rte_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy packages/decision/src
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .

  plain-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check_plain_text.sh
