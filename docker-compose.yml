services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rte
      POSTGRES_PASSWORD: rte
      POSTGRES_DB: rte
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rte -d rte"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
